name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Lint
        run: go vet ./...

      - name: Run tests on PR branch
        id: pr_cov
        run: |
          go test -race -coverprofile=/tmp/coverage-pr.out ./...
          PR_COV=$(go tool cover -func=/tmp/coverage-pr.out | grep total | awk '{print $3}' | tr -d '%')
          echo "coverage=$PR_COV" >> "$GITHUB_OUTPUT"
          echo "PR branch coverage: ${PR_COV}%"

      - name: Checkout develop
        run: |
          git checkout develop
          go mod download

      - name: Run tests on develop
        id: dev_cov
        run: |
          go test -race -coverprofile=/tmp/coverage-develop.out ./...
          DEV_COV=$(go tool cover -func=/tmp/coverage-develop.out | grep total | awk '{print $3}' | tr -d '%')
          echo "coverage=$DEV_COV" >> "$GITHUB_OUTPUT"
          echo "Develop branch coverage: ${DEV_COV}%"

      - name: Compare coverage
        env:
          PR_COV: ${{ steps.pr_cov.outputs.coverage }}
          DEV_COV: ${{ steps.dev_cov.outputs.coverage }}
        run: |
          echo "PR coverage:      ${PR_COV}%"
          echo "Develop coverage:  ${DEV_COV}%"

          if (( $(echo "$PR_COV < 95.0" | bc -l) )); then
            echo "::error::Coverage is ${PR_COV}%, which is below the 95% minimum threshold."
            exit 1
          fi

          echo "✓ Coverage check passed (${PR_COV}% ≥ 95%)"

  benchmarks:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmarks on PR branch
        run: go test -bench=. -benchmem -count=6 -run='^$' ./... > /tmp/bench-pr.txt

      - name: Checkout develop and run benchmarks
        run: |
          git checkout develop
          go mod download
          go test -bench=. -benchmem -count=6 -run='^$' ./... > /tmp/bench-develop.txt

      - name: Compare benchmarks
        id: benchstat
        run: |
          git checkout -
          benchstat /tmp/bench-develop.txt /tmp/bench-pr.txt | tee /tmp/benchstat-result.txt

      - name: Check for regressions
        id: check_regression
        run: |
          # Look for regressions greater than 10%
          REGRESSIONS=$(awk '/\+[0-9]+\.[0-9]+%/ {
            match($0, /\+([0-9]+\.[0-9]+)%/, arr);
            if (arr[1]+0 > 10.0) print $0
          }' /tmp/benchstat-result.txt)

          if [ -n "$REGRESSIONS" ]; then
            echo "::error::Benchmark regressions detected (>10%):"
            echo "$REGRESSIONS"
            echo "has_regressions=true" >> "$GITHUB_OUTPUT"
          else
            echo "No significant regressions detected."
            echo "has_regressions=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post benchmark results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = fs.readFileSync('/tmp/benchstat-result.txt', 'utf8');
            const hasRegressions = '${{ steps.check_regression.outputs.has_regressions }}' === 'true';
            const status = hasRegressions ? '⚠️ **Regressions detected (>10%)**' : '✅ No significant regressions';

            const marker = '<!-- benchmark-comparison -->';
            const body = [
              marker,
              '## Benchmark Comparison',
              '',
              status,
              '',
              '```',
              result,
              '```',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on regression
        if: steps.check_regression.outputs.has_regressions == 'true'
        run: |
          echo "::error::Benchmarks regressed by more than 10%. See PR comment for details."
          exit 1
