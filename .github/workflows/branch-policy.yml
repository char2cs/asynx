name: Branch Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  enforce:
    name: Enforce branch naming & target
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch name and target
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "Source: $HEAD → Target: $BASE"

          # Every branch targets develop: merging to it cuts the release.
          case "${HEAD%%/*}" in
            feature|enhancement|fix|hotfix|refactor|docs|chore|ci|test|dependabot) ;;
            *)
              echo "::error::Branch '$HEAD' does not match any allowed pattern"
              echo "::error::Allowed: feature/*, enhancement/* (minor release), fix/*, hotfix/* (patch release)"
              echo "::error::Allowed without a release: refactor/*, docs/*, chore/*, ci/*, test/*"
              echo "::error::Add the 'breaking-change' label for a major bump."
              exit 1
              ;;
          esac

          if [[ "$BASE" != "develop" ]]; then
            echo "::error::Branch '$HEAD' must target 'develop', not '$BASE'"
            exit 1
          fi
          echo "✓ $HEAD → develop"
